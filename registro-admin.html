<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada | Cuponera</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f7f7f7;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .error-container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: #ff4d4d;
    }

    .error-message {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .error-description {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
    }

    .back-home {
      background-color: #17a2b8;
      color: white;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .back-home:hover {
      background-color: #117a8b;
    }

    .logo {
      max-width: 150px;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 5rem;
      }
      .error-message {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <img src="/img/logo.PNG" alt="Logo Cuponera" class="logo" />
    <div class="error-code">404</div>
    <div class="error-message">¡Ups! Página no encontrada</div>
    <div class="error-description">La página que estás buscando no existe o fue movida. Verifica la URL o regresa al inicio.</div>
    <a href="/" class="back-home">Volver al inicio</a>
  </div>
</body>
</html>
